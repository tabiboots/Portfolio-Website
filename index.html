<!doctype html>

  <head>

    <title>Tabi Cass</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Restore client-side route redirected through /404.html on GitHub Pages.
      (function () {
        var search = window.location.search;
        if (search.length > 1 && search[1] === "/") {
          var decoded = search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", window.location.pathname + decoded + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="main-container">
      <div id="header">
        <a href="/portfolio" aria-label="Go to portfolio">
          <img src="resources/img/interrobang 256.png" alt="interrobang" id="interrobang">
        </a>
        <div id = "nav-container">
          <div id="nav-button-container">
            <div id="nav-button-container-links">
            <a href="/portfolio">Portfolio</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            </div>
            <div id="nav-button-container-socials">
              <a href="https://instagram.com/tabi.sock">Instagram</a>
              <a href="https://www.linkedin.com/in/tabi-cass-29a228278/">LinkedIn</a>
            </div>
          </div>
        </div>
      </div>
      <div id="content-container">
        <div id="content-container-side">
          <div id="content-container-side-about">
            <p>I'm an artist and technologist based in New York City and Toronto. My practice of making art is a hybrid of traditional and digital media, often incorporating interactive elements and generative systems.</p>
          </div>
        </div>
      <div id="content-container-main">
        <!-- Injected by /src/js/portfolio.js -->
      </div>
    </div>
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
