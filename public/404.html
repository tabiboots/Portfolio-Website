<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages serves this file for unknown paths.
      // Redirect to index with encoded path so the SPA router can restore it.
      (function () {
        var l = window.location;
        var pathSegmentsToKeep = l.hostname.endsWith(".github.io") ? 1 : 0;
        var repoBase = l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
        var routePath = l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/");
        var search = l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "";

        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            repoBase +
            "/?/" +
            routePath.replace(/&/g, "~and~") +
            search +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
